# ============================================================
# AI-Assisted Quality Engineering Platform
# Default Framework Configuration
# ============================================================

# ------------------------------------------------------------
# Environment
# ------------------------------------------------------------

environment=qa

# ------------------------------------------------------------
# Browser
# ------------------------------------------------------------

browser=chrome
headless=false

# ------------------------------------------------------------
# Application
# ------------------------------------------------------------

base.url=https://example.com


# ------------------------------------------------------------
# Timeouts - seconds
# ------------------------------------------------------------

implicit.wait=0
explicit.wait=10
page.load.timeout=30
script.timeout=30
# ------------------------------------------------------------
# Execution
# ------------------------------------------------------------

parallel.execution=false
thread.count=1

# ------------------------------------------------------------
# Retry
# ------------------------------------------------------------

retry.count=1

# ------------------------------------------------------------
# Test API
# ------------------------------------------------------------

test.api.base.url=https://jsonplaceholder.typicode.com